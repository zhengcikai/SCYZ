<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天主教学习系统 · 慕道班学习</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <button class="btn-back" id="btnHome" title="返回首页">‹ 首页</button>
    <div class="header-titles">
      <h1 class="site-title">天主教学习系统</h1>
      <p class="site-sub">慕道班学习 · 圣经故事 · 祈祷礼仪 · 自测</p>
    </div>
    <div class="header-search">
      <input type="search" id="globalSearch" placeholder="全站搜索：输入关键词，如「圣事」「天主经」…" autocomplete="off">
    </div>
  </div>
  <nav class="tab-bar" id="tabBar">
    <button data-view="home" class="tab active">首页</button>
    <button data-view="catechism" class="tab">教理问答</button>
    <button data-view="bible_stories" class="tab">圣经故事</button>
    <button data-view="liturgy_prayers" class="tab">礼仪祈祷</button>
    <button data-view="quiz" class="tab">自测题库</button>
  </nav>
</header>

<main id="app">

  <!-- 首页 -->
  <section id="view-home" class="view active">
    <div class="hero">
      <div class="hero-cross">✝</div>
      <h2>愿主平安与你同在</h2>
      <p class="hero-desc">本系统依据《天主教教理》《思高圣经》及教会通行译本整理，供慕道班学员与教友日常学习、复习与自测使用。</p>
    </div>
    <div class="module-grid" id="moduleGrid"></div>
    <div class="home-search-tip">
      <label for="homeSearch">全站关键字搜索：</label>
      <input type="search" id="homeSearch" placeholder="输入关键词，如「圣事」「三位一体」「复活」…">
    </div>
    <footer class="site-footer">
      <p>内容依据《天主教教理》《思高圣经》等，详见各条出处。本站仅供学习之用。</p>
    </footer>
  </section>

  <!-- 教理问答 / 圣经故事 / 礼仪祈祷 共用浏览视图 -->
  <section id="view-browse" class="view">
    <div class="browse-head">
      <h2 id="browseTitle"></h2>
      <p id="browseDesc"></p>
    </div>
    <div class="cat-nav" id="catNav"></div>
    <div id="browseContent"></div>
  </section>

  <!-- 搜索结果 -->
  <section id="view-search" class="view">
    <div class="browse-head">
      <h2>搜索结果</h2>
      <p id="searchMeta"></p>
    </div>
    <div id="searchContent"></div>
  </section>

  <!-- 自测题库 -->
  <section id="view-quiz" class="view">
    <div class="quiz-stage" id="quizHome">
      <h2>自测题库</h2>
      <div class="quiz-mode-cards">
        <button class="mode-card" id="modePractice">
          <span class="mode-icon">✎</span>
          <h3>练习模式</h3>
          <p>选择题型与类别，逐题作答，立即判分并显示解析。</p>
        </button>
        <button class="mode-card" id="modeMock">
          <span class="mode-icon">☑</span>
          <h3>整卷模拟</h3>
          <p>随机抽题组卷，交卷后统一判分，可回顾每题对错与解析。</p>
        </button>
        <button class="mode-card" id="modeHistory">
          <span class="mode-icon">☰</span>
          <h3>成绩记录</h3>
          <p>历次模拟成绩自动保存在本机，可查看与清除。</p>
        </button>
      </div>
    </div>

    <!-- 练习设置 -->
    <div class="quiz-stage hidden" id="practiceSetup">
      <h2>练习模式 · 设置</h2>
      <div class="setup-row"><label>题型：</label>
        <select id="practiceType">
          <option value="all">全部题型</option>
          <option value="choice">单选</option>
          <option value="truefalse">判断</option>
          <option value="fill">填空</option>
          <option value="essay">简答</option>
        </select>
      </div>
      <div class="setup-row"><label>类别：</label>
        <select id="practiceCat"><option value="all">全部类别</option></select>
      </div>
      <div class="setup-actions">
        <button class="btn primary" id="btnStartPractice">开始练习</button>
        <button class="btn" id="practiceBack">返回</button>
      </div>
    </div>

    <!-- 练习答题 -->
    <div class="quiz-stage hidden" id="practiceRun">
      <div class="quiz-progress"><span id="practicePos"></span><span id="practiceTotal"></span></div>
      <div id="practiceBox"></div>
      <div class="quiz-nav">
        <button class="btn" id="practicePrev">上一题</button>
        <button class="btn primary" id="practiceNext">下一题</button>
        <button class="btn" id="practiceQuit">结束练习</button>
      </div>
    </div>

    <!-- 模拟设置 -->
    <div class="quiz-stage hidden" id="mockSetup">
      <h2>整卷模拟 · 设置</h2>
      <div class="setup-row"><label>题目数量：</label>
        <select id="mockCount">
          <option value="10">10 题</option>
          <option value="20" selected>20 题</option>
          <option value="30">30 题</option>
        </select>
      </div>
      <div class="setup-actions">
        <button class="btn primary" id="btnStartMock">开始模拟</button>
        <button class="btn" id="mockBack">返回</button>
      </div>
    </div>

    <!-- 模拟答题 -->
    <div class="quiz-stage hidden" id="mockRun">
      <div class="quiz-progress"><span id="mockPos"></span><span id="mockTotal"></span></div>
      <div id="mockBox"></div>
      <div class="quiz-nav">
        <button class="btn" id="mockPrev">上一题</button>
        <button class="btn primary" id="mockNext">下一题</button>
        <button class="btn danger" id="mockSubmit">交卷</button>
      </div>
    </div>

    <!-- 模拟结果 -->
    <div class="quiz-stage hidden" id="mockResult">
      <h2>模拟成绩</h2>
      <div id="resultBox"></div>
      <div class="quiz-nav">
        <button class="btn primary" id="mockReviewBtn">回顾答题</button>
        <button class="btn" id="mockResultBack">返回题库</button>
      </div>
    </div>

    <!-- 成绩历史 -->
    <div class="quiz-stage hidden" id="historyView">
      <h2>成绩记录</h2>
      <p class="hint">说明：简答题请对照参考答案自查，成绩按客观题（单选/判断/填空）计分。</p>
      <div id="historyList"></div>
      <div class="quiz-nav">
        <button class="btn danger" id="btnClearHistory">清除全部记录</button>
        <button class="btn" id="historyBack">返回</button>
      </div>
    </div>
  </section>

</main>

<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
