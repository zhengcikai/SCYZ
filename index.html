 culpa, mea culpa, mea maxima culpa；念此句时信友以右手轻捶胸前，表示痛悔。\n【个人痛悔经（告解后常用）】\n我的天主，我全心痛悔得罪了祢；我痛恨我一切罪过，因为我不但怕应得的罪罚，尤其因为我得罪了祢——无限美善、堪享一切爱情的天主。我决志依靠祢的圣宠，痛改前非，再也不犯罪过，并避免犯罪的机会。阿们。","source":"《感恩祭典》第一式·忏悔礼；香港教区礼仪委员会《开始仪式》PDF；天主教北京教区西什库《晚课经文》","keywords":["悔罪经","忏悔词","Confiteor","痛悔经","弥撒开始"]},{"id":"lit-028","module":"liturgy","category":"常用祈祷经文","title":"饭前经与饭后经","content":"【饭前经】\n万善的天主，我们的主，求你降福我们，及我们所将领受的你的恩赐，因我们的主基督。阿们。\n（传统文：天主降福我等，暨所将受于主普施之恩，因主基督。亚孟。）\n【饭后经】\n全能的天主，我们感谢你，因你一切的恩赐，因我们的主基督。阿们。\n（常加：并求你使已亡信众，赖天主的仁慈，安息于永久的平安。阿们。）\n【意义】用饭前后举手划十字、短祷，是把日常饮食奉献于天主，感谢养育之恩，养成凡事谢恩的习惯（得6:6；格前10:31）。","source":"天主教在线《要理问答·常用经文》；传统拉丁 Benedic Domine / Agimus tibi gratias 中文译本","keywords":["饭前经","饭后经","谢饭","感恩","短祷"]},{"id":"lit-029","module":"liturgy","category":"常用祈祷经文","title":"玫瑰经（结构与五端奥迹）","content":"玫瑰经（Rosary）是以圣母为引导、默想基督一生奥迹的祈祷。\n【结构】\n1. 十字圣号 → 2. 宗徒信经一遍 → 3. 天主经一遍 → 4. 圣母经三遍 → 5. 圣三光荣经一遍；\n随后依次默想五端奥迹：每端念天主经一遍、圣母经十遍、圣三光荣经一遍，并加念法蒂玛祷词；五端后念《又圣母经》结束。\n【四套奥迹及分配】\n欢喜五端（周一、周六）：①圣母领报 ②圣母访亲 ③耶稣诞生 ④献耶稣于圣殿 ⑤耶稣十二岁在圣殿讲道。\n痛苦五端（周二、周五）：①山园祈祷 ②耶稣受鞭打 ③耶稣受茨冠凌辱 ④耶稣背十字架上加尔瓦略山 ⑤耶稣死在十字架上。\n荣福五端（周三、周日）：①耶稣复活 ②耶稣升天 ③圣神降临 ④圣母蒙召升天 ⑤天主立圣母为天后。\n光明五端（周四，教宗若望保禄二世2002年《童贞玛利亚的玫瑰经》增添）：①耶稣约旦河受洗 ②加纳婚宴行奇迹 ③宣讲天国 ④塔博尔山显圣容 ⑤建立圣体圣事。\n【依据】《天主教教理》2678-2679条；教宗若望保禄二世《童贞玛利亚的玫瑰经》宗座牧函（2002）。","source":"《天主教教理》2678-2679条；教宗若望保禄二世《童贞玛利亚的玫瑰经》（2002）；香港教区礼仪委员会《玫瑰经》PDF","keywords":["玫瑰经","Rosary","欢喜五端","痛苦五端","荣福五端","光明五端","圣母"]},{"id":"lit-030","module":"liturgy","category":"常用祈祷经文","title":"慈悲串经","content":"慈悲串经（Chaplet of Divine Mercy）是傅天娜修女（St. Faustina Kowalska）在耶稣显现指示下传授的祈祷，用于求主怜悯普世罪人。用普通玫瑰念珠诵念。\n【开始】先念天主经一遍、圣母经一遍、宗徒信经一遍。\n【每粒大珠上念（一遍）】\n永生之父，我把祢至爱之子，我们的主耶稣基督的圣体、圣血、灵魂及天主性奉献给祢，以赔补我们及普世的罪过。\n【每粒小珠上念（连续十次）】\n因祂的至悲惨苦难，求祢垂怜我们及普世。\n【结束（连续三遍）】\n至圣天主，至圣强有力者，至圣常存者，求祢垂怜我们及普世。\n【最后短祷】主耶稣，我们信赖祢！\n【依据】《天主的慈悲》敬礼；北京西什库《常用经文·慈悲串经》；香港教区礼仪委员会《慈悲串经》PDF。","source":"傅天娜修女《天主仁慈的讯音》；天主教北京教区《万有真原·慈悲串经》；香港教区礼仪委员会PDF","keywords":["慈悲串经","Divine Mercy","傅天娜修女","耶稣慈悲"]},{"id":"lit-031","module":"liturgy","category":"常用祈祷经文","title":"又圣母经（圣母亲皇后经 / Salve Regina）","content":"又圣母经（Hail Holy Queen）是中世纪以来西方教会晚祷结束时，向圣母玛利亚所念的著名祷文。\n【白话文全文】\n母后万福，仁慈的母亲，我们的生命、我们的甘饴、我们的希望。厄娃子孙在此尘世向妳哀呼，在这涕泣之谷向妳叹息哭求。我们的主保，求妳回顾、怜视我们，一旦流亡期满，使我们得见妳的圣子，万民称颂的耶稣。童真玛利亚，妳是宽仁的、慈悲的、甘饴的，天主之母，请为我们祈求，使我们堪受基督的恩许。阿们。\n【用途】玫瑰经每串结束后常念此经；每日晚祷（日课）中亦咏唱。","source":"《天主教教理》2675条；台湾主教团《天主教常用经文》（Salve Regina 中文译本）","keywords":["又圣母经","母后万福","Salve Regina","圣母","晚祷"]},{"id":"lit-032","module":"liturgy","category":"要理背诵","title":"天主十诫","content":"【第一诫】钦崇一天主在万有之上。\n【第二诫】毋呼天主圣名，以发虚誓。\n【第三诫】守瞻礼主日。\n【第四诫】孝敬父母。\n【第五诫】毋杀人。\n【第六诫】毋行邪淫。\n【第七诫】毋偷盗。\n【第八诫】毋妄证。\n【第九诫】毋愿他人妻。\n【第十诫】毋贪他人财物。\n【总结】右十诫，总归二者：爱天主在万有之上，并爱人如己。（玛22:37-40）\n【出处】出谷纪20:1-17；申命纪5:6-21；《要理问答》卷二·十诫。\n【依据】《天主教教理》2052-2557条。","source":"思高本《出谷纪》20:1-17、《申命纪》5:6-21；《天主教教理》2052-2557条；天主教在线《要理问答》","keywords":["十诫","天主十诫","诫命","出谷纪","爱主爱人"]},{"id":"lit-033","module":"liturgy","category":"要理背诵","title":"真福八端（山中圣训）","content":"耶稣在山中圣训中所宣的真福八端（思高本玛5:3-10）：\n一、神贫的人是有福的，因为天国是他们的。\n二、哀恸的人是有福的，因为他们要受安慰。\n三、温良的人是有福的，因为他们要承受土地。\n四、饥渴慕义的人是有福的，因为他们要得饱饫。\n五、怜悯人的人是有福的，因为他们要受怜悯。\n六、心里洁净的人是有福的，因为他们要看见天主。\n七、缔造和平的人是有福的，因为他们要称为天主的子女。\n八、为义而受迫害的人是有福的，因为天国是他们的。\n【依据】思高本《玛窦福音》5:3-10；《天主教教理》1716-1724条。","source":"思高本《玛窦福音》5:3-10；《天主教教理》1716-1724条；天主教温州教区每日读经","keywords":["真福八端","山中圣训","八福","玛窦福音5章"]},{"id":"lit-034","module":"liturgy","category":"要理背诵","title":"七件圣事名称","content":"基督建立、教会信守的圣事共有七件：\n一、圣洗圣事；\n二、坚振圣事；\n三、圣体圣事；\n四、忏悔（和好）圣事；\n五、病人傅油圣事；\n六、圣秩圣事；\n七、婚姻圣事。\n【入门三圣事】圣洗、坚振、圣体——为基督信仰生命的基础。\n【医治类圣事】忏悔（和好）、病人傅油——医治灵魂与身体的软弱。\n【服务与共融类圣事】圣秩、婚姻——为服务教会与人类团队而建立。\n【依据】《天主教教理》1113-1114、1210条；《要理问答》卷三·七件圣事。","source":"《天主教教理》1113-1114、1210条；天主教在线《要理问答》卷三·七件圣事","keywords":["七件圣事","圣事名称","入门圣事","背诵"]},{"id":"lit-035","module":"liturgy","category":"要理背诵","title":"圣神七恩","content":"圣神七恩（依11:2-3预言默西亚所赋之神恩）在坚振圣事中丰满地赐与领受者：\n一、上智——能以天主的观点看万物，轻世重天主；\n二、明达——能明了天主启示的深奥；\n三、超见——能在具体抉择中辨认天主旨意；\n四、勇力（刚毅）——勇敢克服信德与救灵的障碍；\n五、孝爱——以子女心肠亲近天主；\n六、聪敏——能分辨善恶、明白信德要义；\n七、敬畏（敬畏天主）——畏得罪天上大父，深爱天主。\n【依据】思高本《依撒意亚先知书》11:2-3；《天主教教理》1830-1831条；梵蒂冈广播电台《要理》第三卷。","source":"思高本《依撒意亚先知书》11:2-3；《天主教教理》1830-1831条；梵蒂冈广播电台《教理》1830-1831条","keywords":["圣神七恩","七恩","依撒意亚11章","坚振"]},{"id":"lit-036","module":"liturgy","category":"要理背诵","title":"三超德与四枢德","content":"向天主之德（超德，天主直接注入灵魂的三德）：\n一、信德——信从天主及其启示；\n二、望德——信赖天主的救恩与恩许；\n三、爱德——爱天主万有之上，并爱人如己。\n四枢德（人自然德性的枢纽）：\n一、智德——辨别真正的善；\n二、义德——给人及自己所应得；\n三、勇德——面对危险与困难不屈；\n四、节德——节制情欲与享乐。\n【依据】《天主教教理》1812-1845条；格前13:13；智8:7。\n【背诵口诀】信、望、爱为向天主三超德；智、义、勇、节为四枢德。","source":"《天主教教理》1812-1845条；思高本《格林多前书》13:13；《智慧篇》8:7","keywords":["三超德","四枢德","信望爱","智义勇节","德性"]},{"id":"lit-037","module":"liturgy","category":"教会常识","title":"教会圣统制（教宗、主教、神父、执事）","content":"天主教会自下而上的圣统秩序（教会法律与牧职层面）：\n1. 信友（平信徒）：教会的主体，因圣洗而分享基督的司祭、先知、王家职务。\n2. 执事：圣秩第三品，辅理主教与神父，协助礼仪、讲道与慈善服务。\n3. 司铎（神父）：主教的合作者，主持堂区牧灵工作，举行弥撒、听告解、施行圣事。\n4. 主教：宗徒的继承人，由教宗任命，牧养一个教区（地方教会），享有圣化、训导、治理三权。\n5. 枢机主教（红衣主教）：教宗点名的顾问，组成枢机团；教宗逝世时，80岁以下枢机选举新教宗。\n6. 教宗：罗马主教、圣伯多禄的继承人，普世教会的最高牧者，在法定情况下享有不能错的训导权威。\n【依据】梵二《教会》宪章（Lumen Gentium）；《天主教法典》；《天主教教理》874-896条。","source":"梵二大公会议《教会》宪章；《天主教教理》874-896条；天主教在线《天主教法典·教会圣统制》","keywords":["教宗","枢机","主教","神父","执事","圣统制","教会"]},{"id":"lit-038","module":"liturgy","category":"教会常识","title":"修会与奉献生活者","content":"除圣秩外，教会内有另一类奉献生活者，称为会士（男修会）与修女（女修会）。\n【三愿】发初愿（暂愿）与永愿（终身愿），矢发三愿：\n- 神贫——不私蓄财物，一切属于修会，完全依赖天主眷顾；\n- 贞洁——为天国而独身，全心事主；\n- 服从——服从长上，代表天主旨意。\n【类型】\n- 静观修会（如本笃会、加尔默罗会）：以祈祷、克己为专业。\n- 活动修会（如耶稣会、方济各会、多明我会）：从事福传、教育、医疗、慈善等服务。\n- 使徒生活团、世俗会士等在俗奉献生活团体。\n【依据】梵二《修会生活革新法令》；《天主教教理》914-932条。","source":"梵二大公会议《修会生活革新法令》；《天主教教理》914-932条","keywords":["修会","会士","修女","三愿","神贫贞洁服从","奉献生活"]},{"id":"lit-039","module":"liturgy","category":"教会常识","title":"弥撒中常见的物品与器具","content":"弥撒中常见礼仪用品及其象征：\n- 祭台：祭献与圣餐之桌，象征基督本身，是礼仪的中心。\n- 圣爵（Chalice）：盛葡萄酒（祝圣后为基督宝血）的圣杯。\n- 圣盘/圣体盒：盛无酵面饼（祝圣后为基督圣体）。\n- 苦像：带耶稣身像的十字架，提醒基督祭献。\n- 圣体柜：圣堂中专置圣体的柜柜，信友朝拜圣体之处。\n- 圣水壶：入门式洒圣水礼用，忆及圣洗。\n- 圣油：圣洗、坚振、圣秩、病人傅油所用的祝圣油。\n- 弥撒经书（Graduale/Missale）：主祭举行弥撒所用经文书。\n- 祭衣：主祭所穿之长白衣（alba）、腰带、胸衣、祭披（chasuble），颜色随节期而变（紫/白/绿/红）。\n- 十字架与蜡烛：象征基督是世界的光。\n【依据】《天主教教理》1199-1201条；礼仪宪章。","source":"《天主教教理》1199-1201条；梵二《礼仪》宪章（Sacrosanctum Concilium）","keywords":["弥撒物品","祭台","圣爵","圣体柜","苦像","祭衣"]},{"id":"lit-040","module":"liturgy","category":"教会常识","title":"礼仪中常见的手势与动作","content":"信友在礼仪中常用的身体动作及含义：\n- 划十字圣号：以右手在额、胸、左右肩划十字，呼号「因父、及子、及圣神之名」，是信仰与救赎奥迹的标记，起点终点皆用。\n- 跪拜（下跪/屈膝）：在圣体前、经过圣体柜时屈膝下跪（genuflection），表示对基督真实临在的至尊敬。\n- 鞠躬：宣读福音前、纪念圣人时，以腰身鞠躬致敬。\n- 深深躬身（profound bow）：在信经「由圣神降孕，由童贞玛利亚取得肉躯而成为人」处，全体躬身。\n- 捶胸：念忏悔词「我罪、我罪、我的重罪」时，以右手轻捶胸口，表示痛己之罪。\n- 合掌与举手：祈祷时心斋专注；主祭举手祝祷，代表基督大司祭。\n- 领圣体时：张口伸舌或双手交叉于胸前，恭领圣体。\n【依据】《天主教教理》1068、1345条；《罗马弥撒经书总论》。","source":"《天主教教理》1068、1345条；《罗马弥撒经书总论》（General Instruction of the Roman Missal）","keywords":["手势","划十字","跪拜","鞠躬","捶胸","礼仪动作"]},{"id":"lit-041","module":"liturgy","category":"教会常识","title":"主日（星期日）的意义与守斋","content":"主日（Dominica，星期日）是「一周的第八日」——基督复活的日子，也是新创造的日子。\n【天主教义务】\n1. 全体已领洗信友，除重大理由外，有义务主日参与弥撒。\n2. 主日应停止妨碍敬天主、妨碍主日喜乐的日常工作，把这一天特别奉献给天主。\n3. 守大小斋：年满18至59岁者，圣周五及圣灰礼仪日守大斋（一天饱食一次，两次小食）；全年星期五守小斋（不食热血动物肉，或以其他克己善功代替）。\n【主日的名称】主的日子（Apk 1:10）；八日的第一日；基督徒的复活日。\n【依据】《天主教教理》2180-2193条；《天主教法典》1246-1253条。","source":"《天主教教理》2180-2193条；《天主教法典》1246-1253条","keywords":["主日","星期日","主日弥撒","斋戒","义务"]}],"quiz_questions":[{"id":"quiz-001","module":"quiz","category":"信仰总论","title":"圣经全书共有多少卷？","content":"天主教《圣经》（思高本）新旧约合计共有多少卷？","type":"choice","options":["A. 66卷","B. 73卷","C. 72卷","D. 64卷"],"answer":"B","explanation":"天主教圣经共73卷：旧约46卷（含七卷次经）、新约27卷；基督新教为66卷，因未收录次经。","source":"《天主教教理》120-127条；思高圣经目录","keywords":["圣经","卷数","旧约","新约"]},{"id":"quiz-002","module":"quiz","category":"信仰总论","title":"信仰的中心是谁？","content":"基督信仰全部启示与教会宣认的中心是：","type":"choice","options":["A. 教会组织","B. 道德规范","C. 耶稣基督","D. 圣经知识"],"answer":"C","explanation":"信仰的中心是耶稣基督，祂是天主子、救世主；教会、圣经、伦理都围绕基督而存在（格前3:11）。","source":"《天主教教理》422-429条；格前3:11","keywords":["信仰","耶稣基督","中心"]},{"id":"quiz-003","module":"quiz","category":"信仰总论","title":"圣经是天主默示、无误的话。","content":"圣经是天主因圣神默感而写成的，在关乎得救的真理上无误。","type":"truefalse","answer":"对","explanation":"教会相信圣经是天主默示的（弟后3:16），在救恩真理上无误；这并不要求每句字面都是现代科学意义上的史实。","source":"《天主教教理》105-108条；弟后3:16","keywords":["圣经","默感","无误"]},{"id":"quiz-004","module":"quiz","category":"信仰总论","title":"圣经新旧约卷数","content":"天主教《圣经》旧约有（ ）卷，新约有（ ）卷，全书共73卷。","type":"fill","answer":"46；27","explanation":"旧约46卷（含七卷次经），新约27卷，合计73卷。","source":"思高圣经目录；《天主教教理》120-124条","keywords":["圣经","卷数","旧约","新约"]},{"id":"quiz-005","module":"quiz","category":"信仰总论","title":"什么是信德？","content":"简述天主教所讲“信德”（信仰）的含义。","type":"essay","answer":"1) 信德是天主白白赐予的恩宠，是圣神在人心中的工作；2) 信德是人自由地承认、依附天主，并完全信服祂所启示的一切；3) 信德不是盲目迷信，而是在理性与恩宠光照下的自由抉择；4) 信德藉爱德行事（迦5:6），并在教会生活中持守。","explanation":"评分要点：须答出“天主恩宠+人的自由回应”“依附天主启示”“以爱德行事”三层意思。","source":"《天主教教理》150-165条；迦拉达书5:6","keywords":["信德","信仰","恩宠"]},{"id":"quiz-006","module":"quiz","category":"信仰总论","title":"救恩最初来自谁？","content":"人不能靠自己的力量获得成义与永生，救恩最初来自：","type":"choice","options":["A. 人的善功","B. 法律遵守","C. 天主的慈爱与召叫","D. 教会神职人员"],"answer":"C","explanation":"救恩源于天主的慈爱与先召叫，人以信德回应；善功是恩宠在人心中的果实，不是赚取永生的代价。","source":"《天主教教理》1987-2005条；罗马书3:24","keywords":["救恩","恩宠","成义"]},{"id":"quiz-007","module":"quiz","category":"信仰总论","title":"恩宠是人凭善行赚来的。","content":"只要我行善积德，就能凭功劳赚得天主的恩宠。","type":"truefalse","answer":"错","explanation":"恩宠是天主白白赐予的（罗11:6；罗6:23），人不能赚得最初的恩宠；善行是恩宠在人心中工作的果实。","source":"《天主教教理》1996-2002条；罗马书11:6","keywords":["恩宠","善行","功绩"]},{"id":"quiz-008","module":"quiz","category":"天主与三位一体","title":"我们信的天主是几位？","content":"天主教宣认的天主是：","type":"choice","options":["A. 三位天主","B. 一位天主，内有三个位格","C. 一位天主，只有一个位格","D. 三位神合成一位天主"],"answer":"B","explanation":"我们信唯一的天主，祂在唯一的性体内有三个位格：父、子、圣神，即至圣圣三（玛28:19）。","source":"《天主教教理》232-267条；玛窦福音28:19","keywords":["三位一体","天主","位格"]},{"id":"quiz-009","module":"quiz","category":"天主与三位一体","title":"“我是自有者”启示于哪卷书？","content":"天主在焚烧的荆棘中向梅瑟启示祂的名字“我是自有者”，记载于：","type":"choice","options":["A. 《创世纪》","B. 《申命纪》","C. 《出埃及记》","D. 《户籍纪》"],"answer":"C","explanation":"载于出谷纪（出埃及记）3:14，表明天主是自有的、永恒的、无限的存有。","source":"《出埃及记》3:14；《天主教教理》205-213条","keywords":["天主的名","出埃及记","自有者"]},{"id":"quiz-010","module":"quiz","category":"天主与三位一体","title":"三位一体是三位天主。","content":"父、子、圣神是三位彼此分开的天主，合起来才是天主。","type":"truefalse","answer":"错","explanation":"三位一体不是三位神，而是唯一天主性体内的三个位格：同性同体、同性同属，并非三位天主。","source":"《天主教教理》253-256条","keywords":["三位一体","位格","性体"]},{"id":"quiz-011","module":"quiz","category":"天主与三位一体","title":"三位一体的三个位格","content":"至圣圣三包括三个位格：（ ）、（ ）、（ ）。","type":"fill","answer":"圣父；圣子；圣神","explanation":"父不是子，子不是圣神，圣神不是父；但三位共有唯一的天主性、本质与本体。","source":"《天主教教理》255-258条；玛窦福音28:19","keywords":["三位一体","圣父","圣子","圣神"]},{"id":"quiz-012","module":"quiz","category":"天主与三位一体","title":"简述三位一体奥迹","content":"简述天主教信仰中“至圣圣三”的奥迹。","type":"essay","answer":"1) 我们信唯一的天主；2) 天主内有三个真正不同的位格：父、子、圣神；3) 三位共有同一性体、同一天主性，并非三神；4) 父是永恒之源，子由父永恒所生，圣神由父及子所发；5) 这是理性不能完全透彻、却由基督启示的奥迹。","explanation":"评分要点：“一性体、三位格”“非三神”“父子神的关系”三层不可缺。","source":"《天主教教理》232-267条","keywords":["三位一体","奥迹","天主"]},{"id":"quiz-013","module":"quiz","category":"天主与三位一体","title":"天主最核心的属性","content":"若望一书明言“天主是____”，这是启示给我们的天主最核心的面目。","type":"choice","options":["A. 能力","B. 威严","C. 爱","D. 公义"],"answer":"C","explanation":"若一4:8、16明言“天主是爱”；其他属性都在这爱的光照下理解。","source":"《若望一书》4:8,16；《天主教教理》220-221条","keywords":["天主是爱","若望一书"]},{"id":"quiz-014","module":"quiz","category":"天主与三位一体","title":"天主按自己的肖像造了人。","content":"圣经记载天主照自己的肖像造了人，造男造女。","type":"truefalse","answer":"对","explanation":"载于创1:27；人因此具有尊严、理智、自由与爱德的能力。","source":"《创世纪》1:27；《天主教教理》355-361条","keywords":["创世","肖像","人"]},{"id":"quiz-015","module":"quiz","category":"耶稣基督","title":"耶稣由谁而生？","content":"按天主教信仰，耶稣基督取了人性，是由：","type":"choice","options":["A. 若瑟按常理所生","B. 罗马帝国皇室后裔","C. 圣神因童贞玛利亚而孕生","D. 天使化身"],"answer":"C","explanation":"耶稣由圣神受孕、童贞玛利亚所生（玛1:18-25，路1:35），这就是“降生成人”的奥迹。","source":"《玛窦福音》1:18-25；《路加福音》1:35；《天主教教理》496-511条","keywords":["耶稣","降生成人","童贞玛利亚"]},{"id":"quiz-016","module":"quiz","category":"耶稣基督","title":"复活节是哪一天？","content":"教会庆祝耶稣复活的日子（复活节）是：","type":"choice","options":["A. 12月25日","B. 五旬节","C. 复活期主日（春分月圆后第一个主日）","D. 升天节"],"answer":"C","explanation":"复活节按犹太历尼散月十五日推算，即春分后第一次月圆后的第一个主日；12月25日是圣诞节。","source":"《天主教教理》1168-1173条；礼仪年历","keywords":["复活节","耶稣复活","礼仪年"]},{"id":"quiz-017","module":"quiz","category":"耶稣基督","title":"耶稣是真人，也是真天主。","content":"耶稣基督具有完整的神性与完整的人性，是一位二性的天主子。","type":"truefalse","answer":"对","explanation":"迦克墩大公会议（451年）定断：基督一位二性，神性人性不相混、不分离、不调换、不割裂。","source":"《天主教教理》464-470条","keywords":["耶稣基督","一位二性","迦克墩"]},{"id":"quiz-018","module":"quiz","category":"耶稣基督","title":"“厄玛奴耳”的含义","content":"耶稣的另一名字叫“厄玛奴耳”，意思是“（ ）与我们同在”。","type":"fill","answer":"天主（上主）","explanation":"依7:14预言、玛1:23应验，“厄玛奴耳”即“天主与我们同在”，指明基督天主性与人性的结合。","source":"《依撒意亚先知书》7:14；《玛窦福音》1:23","keywords":["厄玛奴耳","耶稣","预言"]},{"id":"quiz-019","module":"quiz","category":"耶稣基督","title":"耶稣复活的信仰意义","content":"简述耶稣基督复活对基督徒信仰的意义。","type":"essay","answer":"1) 证明耶稣是天主子，其教训与救赎为天主所印证；2) 完成救恩，战胜罪恶与死亡；3) 是我们将来复活的根据与保证（格前15）；4) 赐予圣神，建立教会；5) 给信徒带来新生命与希望。","explanation":"评分要点：须答出“证明天主子身份”“战胜死亡”“信徒复活的根据”三点以上。","source":"《天主教教理》638-658条；格前多书15:12-23","keywords":["复活","救恩","信仰"]},{"id":"quiz-020","module":"quiz","category":"耶稣基督","title":"基督的救赎工程完成于：","content":"耶稣基督替人类赎罪、完成救恩，主要是在：","type":"choice","options":["A. 圣诞诞生","B. 约但河受洗","C. 升天","D. 十字架上的受难与复活"],"answer":"D","explanation":"十字架的受难与复活即“逾越奥迹”，是救恩完成的核心；圣诞、传教、升天都指向此。","source":"《天主教教理》571-620条；格前多书15:3-4","keywords":["逾越奥迹","十字架","救赎"]},{"id":"quiz-021","module":"quiz","category":"耶稣基督","title":"耶稣只有人性，没有真正的神性。","content":"耶稣只是一位圣人，被天主收养为子，本身并非真天主。","type":"truefalse","answer":"错","explanation":"这是被教会定断为异端的“嗣子论”。尼西亚信经明认耶稣是天主子、出自天主的天主、出自光的光、出自真天主的真天主。","source":"《天主教教理》464-469条；尼西亚信经","keywords":["耶稣神性","嗣子论","异端"]},{"id":"quiz-022","module":"quiz","category":"圣神","title":"圣神何时降临？","content":"五旬节那天，圣神以火舌的形象降临在宗徒与圣母身上，此事记载于：","type":"choice","options":["A. 《玛窦福音》","B. 《默示录》","C. 《宗徒大事录》","D. 《罗马书》"],"answer":"C","explanation":"载于宗2:1-4；此日常被视为教会的诞辰。","source":"《宗徒大事录》2:1-4；《天主教教理》731-732条","keywords":["圣神","五旬节","宗徒大事录"]},{"id":"quiz-023","module":"quiz","category":"圣神","title":"坚振圣事通常由谁施行？","content":"坚振圣事因圣神赐予印记，其通常的施行者是：","type":"choice","options":["A. 神父（司铎）","B. 教友本人","C. 主教","D. 修女"],"answer":"C","explanation":"按教会现行法，坚振的正常施行者是主教；在紧迫或主教准许时，司铎亦可施行。","source":"《天主教教理》1312-1316条","keywords":["坚振","圣神","主教"]},{"id":"quiz-024","module":"quiz","category":"圣神","title":"圣神是第三位格。","content":"圣神不是一种能力或气氛，而是三位一体中的第三位格，与父、子同性同体。","type":"truefalse","answer":"对","explanation":"尼西亚·君士坦丁堡信经明认圣神是主及赋生命者，发自父及子，与父子同受朝拜、同受光荣。","source":"《尼西亚信经》；《天主教教理》687-690条","keywords":["圣神","位格","信经"]},{"id":"quiz-025","module":"quiz","category":"圣神","title":"圣神的七项恩赐","content":"依传统列举圣神的七项恩赐：智慧、聪敏、（ ）、勇毅、明达、（ ）、敬畏天主。","type":"fill","answer":"超见；孝爱","explanation":"依《依撒意亚先知书》11:2-3，传统列举圣神七恩赐：智慧、聪敏、超见、勇毅、明达、孝爱、敬畏上主。","source":"《依撒意亚先知书》11:2-3；《天主教教理》1831条","keywords":["圣神恩赐","七恩赐"]},{"id":"quiz-026","module":"quiz","category":"圣神","title":"圣神在教会和信徒身上的工作","content":"简述圣神在救恩与教会中的主要工作。","type":"essay","answer":"1) 在五旬节降临，建立并引导教会；2) 赐予信徒成圣、成义的恩宠；3) 藉圣事赋予恩宠与印记；4) 赐人智慧、超见等恩赐，以及爱、喜乐、平安等圣神的果实；5) 引导教会进入一切真理，并助信徒祈祷。","explanation":"评分要点：“建立引导教会”“祝圣成义”“赐恩赐与果实”为核心三点。","source":"《天主教教理》687-747条；格前多书12章；迦拉达书5:22-23","keywords":["圣神","教会","恩赐"]},{"id":"quiz-027","module":"quiz","category":"圣神","title":"圣神只是一种能力，不是位格。","content":"圣神是天主发出的一种力量或影响，本身并非一个“位格”。","type":"truefalse","answer":"错","explanation":"教会信理明确：圣神是第三位格，与父子同性同体；圣神可以被“叫忧”（弗4:30）、被亵渎（玛12:31），证明祂是位格而非单纯能力。","source":"《天主教教理》687-690条；厄弗所书4:30","keywords":["圣神","位格"]},{"id":"quiz-028","module":"quiz","category":"教会","title":"教会具有哪四个标志？","content":"尼西亚信经中宣认教会的四个特征（“四标”）是：","type":"choice","options":["A. 至一、至圣、至公、宗徒传下","B. 宏大、富有、悠久、统一","C. 神圣、奇迹、先知、君王","D. 有形、无形、神恩、组织"],"answer":"A","explanation":"教会是“唯一的、神圣的、大公的、宗徒的”（una, sancta, catholica, apostolica）。","source":"《尼西亚信经》；《天主教教理》811-869条","keywords":["教会四特征","信经"]},{"id":"quiz-029","module":"quiz","category":"教会","title":"教会是谁建立的？","content":"天主教相信教会的创始者是：","type":"choice","options":["A. 伯多禄","B. 保禄","C. 教宗","D. 耶稣基督"],"answer":"D","explanation":"教会是基督亲自建立的（玛16:18）；伯多禄及后继教宗是可见的磐石与牧人。","source":"《玛窦福音》16:18；《天主教教理》763-770条","keywords":["教会","建立","耶稣"]},{"id":"quiz-030","module":"quiz","category":"教会","title":"教宗是圣伯多禄的继承人。","content":"天主教相信罗马教宗是伯多禄的继承人、全教会的可见元首。","type":"truefalse","answer":"对","explanation":"基于玛16:18“你是伯多禄，在这磐石上我要建立我的教会”；教宗与世界主教团共融，负责全教会。","source":"《玛窦福音》16:18-19；《天主教教理》880-883条","keywords":["教宗","伯多禄","继承人"]},{"id":"quiz-031","module":"quiz","category":"教会","title":"教会四特征填空","content":"信经中我们宣认教会是“唯一、（ ）、（ ）、（ ）”的。","type":"fill","answer":"至圣（神圣）；至公（大公）；宗徒传下（宗徒的）","explanation":"即“至一、至圣、至公、宗徒”四个标志，源自尼西亚·君士坦丁堡信经。","source":"《尼西亚信经》；《天主教教理》811-869条","keywords":["教会四特征","信经"]},{"id":"quiz-032","module":"quiz","category":"教会","title":"教会的使命","content":"简述教会在世界上的使命。","type":"essay","answer":"1) 传扬福音，使万民成为基督的门徒（玛28:19大使命）；2) 举行礼仪与圣事，滋养信众；3) 爱德服务，服务弱小与困苦者；4) 持守并传存天主的启示与训导；5) 作世界的盐与光，使人类社会迈向天国。","explanation":"评分要点：“传福音”“礼仪圣事”“爱德服务”为核心三要点。","source":"《玛窦福音》28:19-20；《天主教教理》767-769, 849-856条","keywords":["教会使命","福音","爱德"]},{"id":"quiz-033","module":"quiz","category":"教会","title":"教会公开诞生于哪一天？","content":"按教会传统，公开的教会诞生于：","type":"choice","options":["A. 耶稣圣诞","B. 耶稣复活","C. 五旬节圣神降临","D. 耶稣升天"],"answer":"C","explanation":"五旬节圣神降临，宗徒们公开作证，教会由此开始公开生活（宗2章）。","source":"《宗徒大事录》2章；《天主教教理》731-732条","keywords":["教会诞生","五旬节"]},{"id":"quiz-034","module":"quiz","category":"教会","title":"教会只是人的社会组织。","content":"教会本质上只是一个由信徒自发组成的宗教社团，与神无关。","type":"truefalse","answer":"错","explanation":"教会是基督的奥体、天主的子民、圣神的圣殿，既有凡人组织一面，也有神性一面。","source":"《天主教教理》763-770, 779-781条","keywords":["教会","奥体"]},{"id":"quiz-035","module":"quiz","category":"圣事","title":"教会共有几件圣事？","content":"天主教正统信仰承认的圣事数目是：","type":"choice","options":["A. 三件","B. 五件","C. 八件","D. 七件"],"answer":"D","explanation":"教会有七件圣事：圣洗、坚振、圣体、和好（告解）、病人傅油、圣秩（神品）、婚姻。","source":"《天主教教理》1113条；特利腾大公会议","keywords":["七件圣事","总数"]},{"id":"quiz-036","module":"quiz","category":"圣事","title":"圣洗圣事的施行者","content":"正常情况下，圣洗圣事的施行者是：","type":"choice","options":["A. 主教或神父（圣职人员）","B. 任何教友随意施洗即可，无要求","C. 修女","D. 只有教宗"],"answer":"A","explanation":"圣洗的正常施行者是主教、神父（司铎）；在紧急情况下，任何信徒（甚至非教友）以正确意向奉三位一体之名施洗皆有效。","source":"《天主教教理》1256条","keywords":["圣洗","施洗者"]},{"id":"quiz-037","module":"quiz","category":"圣事","title":"圣体圣事中临在的是：","content":"天主教相信，弥撒中经祝圣后的饼酒内，真实临在的是：","type":"choice","options":["A. 只是象征意义","B. 天主恩典的符号","C. 耶稣基督的体、血、灵魂、天主性真实临在","D. 宗徒们的遗痕"],"answer":"C","explanation":"即“真实临在”（体变）：饼酒的实体变为基督的体血，外形仍存；基督整个人——体、血、灵魂、天主性——临在于此。","source":"《天主教教理》1374-1377条","keywords":["圣体","真实临在","体变"]},{"id":"quiz-038","module":"quiz","category":"圣事","title":"“圣事之圣事”是哪一件？","content":"在七件圣事中，被称为教会整个生命的泉源与顶峰的是：","type":"choice","options":["A. 圣洗","B. 坚振","C. 神品","D. 圣体圣事"],"answer":"D","explanation":"梵二《教会宪章》说：圣体是教会生活的泉源与顶峰，其他圣事都为之服务。","source":"《天主教教理》1322-1324条；《教会宪章》11条","keywords":["圣体","泉源与顶峰"]},{"id":"quiz-039","module":"quiz","category":"圣事","title":"告解（和好）圣事赦免一切大罪。","content":"诚心认罪、痛悔、定改、并补赎后，神父奉基督之权柄赦免领洗后所犯的大罪。","type":"truefalse","answer":"对","explanation":"和好圣事是领洗后堕落者获得罪赦与重新成义的正常途径（若20:22-23）。","source":"《天主教教理》1422, 1480-1484条","keywords":["告解","和好","罪赦"]},{"id":"quiz-040","module":"quiz","category":"圣事","title":"病人傅油圣事只可在临终时领一次。","content":"病人傅油圣事只能在人即将断气时领一次，重病好转后不可再领。","type":"truefalse","answer":"错","explanation":"病人傅油在人重病、衰老或面临死亡危险时即可领；病情恶化或新病复发时可重领。","source":"《天主教教理》1514-1515条","keywords":["病人傅油","临终"]},{"id":"quiz-041","module":"quiz","category":"圣事","title":"七件圣事名称","content":"教会的七件圣事是：圣洗、（ ）、圣体、（ ）、病人傅油、（ ）、婚姻。","type":"fill","answer":"坚振；和好（告解/忏悔）；圣秩（神品）","explanation":"完整七件：圣洗、坚振、圣体、和好（忏悔）、病人傅油、圣秩（神品）、婚姻（婚配）。","source":"《天主教教理》1113条","keywords":["七件圣事","名称"]},{"id":"quiz-042","module":"quiz","category":"圣事","title":"圣事是什么？有什么效果？","content":"简述天主教信仰中“圣事”的定义与主要效果。","type":"essay","answer":"1) 圣事是基督建立、交托教会的有形标记；2) 它们实际赋予（不仅仅象征）恩宠；3) 使人与基督及奥体（教会）结合；4) 赋予圣化恩宠与相应的特殊恩宠；5) 其中圣洗、坚振、神品三件，在灵魂上印上不可磨灭的神印，不能重领。","explanation":"评分要点：“基督建立”“有形标记”“实赋恩宠”“神印”为核心。","source":"《天主教教理》1131-1139, 1272-1274条","keywords":["圣事","定义","恩宠","神印"]},{"id":"quiz-043","module":"quiz","category":"圣事","title":"婚姻圣事的施行者是谁？","content":"按教会传统，婚姻圣事的主要施行者是：","type":"choice","options":["A. 神父","B. 新婚夫妇彼此","C. 主教","D. 教友代表"],"answer":"B","explanation":"婚姻中夫妻彼此互相授予圣事，神父/执事是教会的法定见证人。","source":"《天主教教理》1623, 1630条","keywords":["婚姻","圣事","施行者"]},{"id":"quiz-044","module":"quiz","category":"十诫与道德","title":"天主十诫颁给了谁？","content":"天主在西奈山把十诫颁布给：","type":"choice","options":["A. 亚当","B. 诺厄","C. 梅瑟（摩西）与以民","D. 达味"],"answer":"C","explanation":"载于出19-20、申5；十诫是天主与以民订立盟约的法律核心。","source":"《出埃及记》20:1-17；《天主教教理》2055-2063条","keywords":["十诫","梅瑟","西奈山"]},{"id":"quiz-045","module":"quiz","category":"十诫与道德","title":"第一诫的内容","content":"天主十诫第一诫要求：","type":"choice","options":["A. 不可妄称天主的名","B. 孝敬父母","C. 当守安息日","D. 除天主外，不可敬拜别的神"],"answer":"D","explanation":"第一诫：“我是上主你的天主，除我之外，你不可有别的神。”","source":"《出埃及记》20:2-3；《天主教教理》2084-2114条","keywords":["第一诫","独一神"]},{"id":"quiz-046","module":"quiz","category":"十诫与道德","title":"主日（星期日）应参与弥撒。","content":"教友有义务在星期日及法定节日停止不必要的工作，并全望参与弥撒。","type":"truefalse","answer":"对","explanation":"这是第三诫（圣教四规之一）的要求；星期日是主日，纪念主的复活。","source":"《天主教教理》2180-2183条；圣教四规","keywords":["主日","弥撒","诫命"]},{"id":"quiz-047","module":"quiz","category":"十诫与道德","title":"十诫条数","content":"天主在西奈山颁布给以民的诫命共有（ ）条，通称“十诫”。","type":"fill","answer":"十（10）","explanation":"“十诫”（Decalogue）即十句话，刻在两块石版上。","source":"《出埃及记》34:28；《申命记》4:13","keywords":["十诫","数目"]},{"id":"quiz-048","module":"quiz","category":"十诫与道德","title":"真福八端的意义","content":"简述耶稣在山中圣训中宣讲的“真福八端”及其意义。","type":"essay","answer":"1) 八端为：神贫的人、哀恸的人、温良的人、慕义如渴的人、怜悯人的人、心洁的人、缔造和平的人、为义而受迫害的人是有福的；2) 真福八端揭示天国的价值观，与世俗所重的强大、富足相反；3) 指向永生真福，是基督徒伦理的高峰；4) 描绘基督自己的面貌，呼召信徒跟随祂。","explanation":"评分要点：能列出至少4-6端，并说明其“指向天国、与世俗价值相反”的意义。","source":"《玛窦福音》5:3-10；《天主教教理》1716-1729条","keywords":["真福八端","山中圣训","伦理"]},{"id":"quiz-049","module":"quiz","category":"十诫与道德","title":"构成“大罪”的三要素","content":"按天主教伦理，一项罪过成为大罪，须同时具备：","type":"choice","options":["A. 对象本为重罪、清楚知道、意志完全同意","B. 大损失、大情绪、大公开","C. 大罪过、大群体、大声张","D. 大机会、大诱惑、大后悔"],"answer":"A","explanation":"大罪三条件：对象本为重罪（material gravis）、清楚知道、意志完全同意（教理1857）。","source":"《天主教教理》1857条","keywords":["大罪","三条件","伦理"]},{"id":"quiz-050","module":"quiz","category":"十诫与道德","title":"小罪会丧失圣化恩宠。","content":"小罪（venial sin）虽削弱爱德，但不使人丧失圣化恩宠。","type":"truefalse","answer":"对","explanation":"小罪不破坏与天主的友谊，但使心灵冷淡；可藉悔罪、圣体、补赎等弥补。","source":"《天主教教理》1862-1864条","keywords":["小罪","大罪","恩宠"]},{"id":"quiz-051","module":"quiz","category":"祈祷与灵修","title":"《天主经》是谁教给门徒的？","content":"《天主经》（主祷文）是：","type":"choice","options":["A. 梅瑟在西奈山颁布","B. 保禄写信时所作","C. 耶稣基督亲自教给门徒","D. 早期教会编选"],"answer":"C","explanation":"载于玛6:9-13、路11:2-4，是应门徒请求“主，请教我们祈祷”时耶稣口授的。","source":"《玛窦福音》6:9-13；《天主教教理》2759-2760条","keywords":["天主经","主祷文","耶稣"]},{"id":"quiz-052","module":"quiz","category":"祈祷与灵修","title":"玫瑰经主要敬礼谁？","content":"玫瑰经是一种反复诵念、默想耶稣和玛利亚奥迹的祈祷，主要敬礼：","type":"choice","options":["A. 若洗者","B. 圣若瑟","C. 圣母玛利亚","D. 天使长弥额尔"],"answer":"C","explanation":"玫瑰经通过圣母，默想基督的救赎奥迹（欢喜、痛苦、光荣、光明五组奥迹）。","source":"《天主教教理》2678-2679条","keywords":["玫瑰经","圣母","祈祷"]},{"id":"quiz-053","module":"quiz","category":"祈祷与灵修","title":"天主经第一句是“我们的天父”。","content":"《天主经》的开头是“我们在天的父，愿你的名被尊为圣……”。","type":"truefalse","answer":"对","explanation":"玛6:9；“父”（阿爸 Abba）是耶稣启示给门徒对天主最亲密的称呼。","source":"《玛窦福音》6:9；《天主教教理》2779-2782条","keywords":["天主经","天父"]},{"id":"quiz-054","module":"quiz","category":"祈祷与灵修","title":"天主经中的祈求","content":"天主经中我们祈求：“愿你的（ ）来临，愿你的（ ）承行，在地如在天。”","type":"fill","answer":"国；旨（旨意）","explanation":"玛6:10，基督徒最核心的祈祷：愿天主为王、愿祂的旨意奉行在人间。","source":"《玛窦福音》6:10","keywords":["天主经","天国","旨意"]},{"id":"quiz-055","module":"quiz","category":"祈祷与灵修","title":"祈祷的意义与常用方式","content":"简述天主教信仰中“祈祷”的意义与常见方式。","type":"essay","answer":"1) 祈祷是人心对天主的言语与聆听，是子女与父的对话；2) 它是恩宠与我们的回应相结合；3) 常用方式包括：诵经、默想、默观、感恩、祈求、补赎；4) 具体经文如天主经、圣母经、圣三光荣经、玫瑰经；5) 主日弥撒、每日私祷、家庭祈祷是教会生活的重要支柱。","explanation":"评分要点：“人与天主对话”“恩宠+回应”“举出至少两种方式”。","source":"《天主教教理》2558-2565, 2650-2661条","keywords":["祈祷","默想","灵修"]},{"id":"quiz-056","module":"quiz","category":"祈祷与灵修","title":"只要把经文念出来就算祈祷。","content":"祈祷等于把经文快速念完，不必用心思与情感。","type":"truefalse","answer":"错","explanation":"耶稣批评只在唇舌上亲近天主而心远离的人（玛15:8）；祈祷须心神结合，念经只是工具。","source":"《玛窦福音》15:8；《天主教教理》2700-2712条","keywords":["祈祷","用心","念经"]},{"id":"quiz-057","module":"quiz","category":"圣母与诸圣","title":"玛利亚怎样怀上耶稣？","content":"天主教相信耶稣的母亲玛利亚：","type":"choice","options":["A. 与若瑟正常结婚后怀孕","B. 天生为神","C. 被天使奇迹般由若瑟受孕","D. 因圣神受孕，卒世童贞"],"answer":"D","explanation":"玛利亚终身童贞：受孕基督是由圣神，且在耶稣生前、诞生时及以后始终童贞。","source":"《路加福音》1:27,34-35；《天主教教理》499-500条","keywords":["圣母","童贞","圣神"]},{"id":"quiz-058","module":"quiz","category":"圣母与诸圣","title":"圣母灵魂肉身被接升天的信条","content":"1950年教宗定义的信条“玛利亚灵魂肉身光荣升天”称为：","type":"choice","options":["A. 无染原罪","B. 天主之母","C. 圣母升天","D. 卒世童贞"],"answer":"C","explanation":"碧岳十二世1950年颁布《何其强大的天主》（Munificentissimus Deus），定义圣母升天信条。","source":"《天主教教理》966-970条","keywords":["圣母升天","信条"]},{"id":"quiz-059","module":"quiz","category":"圣母与诸圣","title":"敬礼圣母和朝拜天主是同一回事。","content":"我们敬拜（latria）圣母如同敬拜天主一样。","type":"truefalse","answer":"错","explanation":"教会区分：朝拜（latria）只归于天主；对圣母及诸圣是“敬礼”（dulia），对圣母是特殊的“孝爱敬礼”（hyperdulia）。","source":"《天主教教理》971, 2132条","keywords":["圣母敬礼","朝拜","孝爱"]},{"id":"quiz-060","module":"quiz","category":"圣母与诸圣","title":"圣母经","content":"圣母经：“万福玛利亚，满被（ ），主与你同在。你在妇女中是蒙祝福的，你的胎儿耶稣也是蒙祝福的。天主圣母玛利亚，为我们（ ），现在和临终之时，祈祷。阿们。”","type":"fill","answer":"圣宠（恩宠）；罪人","explanation":"经文融合路1:28“满被恩宠”与路1:42“在妇女中是蒙祝福的”，是教会最常用的向圣母请安的祈祷。","source":"《路加福音》1:28,42；《天主教教理》2676条","keywords":["圣母经","经文"]},{"id":"quiz-061","module":"quiz","category":"圣母与诸圣","title":"圣母在救恩工程中的地位","content":"简述天主教信仰中圣母玛利亚在救恩工程中的地位与角色。","type":"essay","answer":"1) 她是天主子的母亲（天主之母）；2) 由圣神受孕，卒世童贞；3) 因预先的救恩而“无染原罪”；4) 在十字架下与基督的救赎结合，成为人类的母亲（新厄娃）；5) 灵魂肉身被接升天，是教会的典型与母亲。","explanation":"评分要点：“天主之母”“童贞/无染原罪”“与救赎结合”“升天”四点至少答出三点。","source":"《天主教教理》484-511, 773, 963-970条","keywords":["圣母","天主之母","救赎"]},{"id":"quiz-062","module":"quiz","category":"圣母与诸圣","title":"诸圣相通功。","content":"天上的诸圣、炼灵与在世旅途的教会信徒，在基督奥体内彼此相通、互相代祷。","type":"truefalse","answer":"对","explanation":"“诸圣相通功”是信经宣认的真理；我们请诸圣转祷，不是拜他们，而是请他们代求。","source":"《天主教教理》956-962条","keywords":["诸圣相通功","代祷"]},{"id":"quiz-063","module":"quiz","category":"末世与终局","title":"人死后的结局是：","content":"教会训导明确：“人人死后都要受审判，然后按照自己的行为得报应。”这指的是：","type":"choice","options":["A. 死后化为乌有","B. 死后轮回转生","C. 死后且有审判，然后是永生或永罚","D. 死后成为精灵"],"answer":"C","explanation":"希9:27“按定为人人都要死一次，死后还要受审判”。","source":"《希伯来书》9:27；《天主教教理》1021-1022条","keywords":["末世","死后","审判"]},{"id":"quiz-064","module":"quiz","category":"末世与终局","title":"炼狱是什么状态？","content":"按天主教训导，炼狱是：","type":"choice","options":["A. 地狱的一部分","B. 天堂的另一名称","C. 人死后的沉睡","D. 已蒙罪赦、但尚需炼净后才能进天国者的状态"],"answer":"D","explanation":"炼狱是那些在天主恩宠中去世、但尚未完全炼净者，暂时炼净的状态，之后才能见天主。","source":"《天主教教理》1030-1032条","keywords":["炼狱","炼净","末世"]},{"id":"quiz-065","module":"quiz","category":"末世与终局","title":"天堂是与天主永远同在。","content":"天堂（永生）是被救者在光荣中面对面享见天主、与天主及诸圣永远共融的状态。","type":"truefalse","answer":"对","explanation":"即“真福直观”（visio beatifica）：被救者直达天主本体，享永远福乐。","source":"《天主教教理》1023-1029条","keywords":["天堂","永生","真福"]},{"id":"quiz-066","module":"quiz","category":"末世与终局","title":"人的“四终”","content":"传统慕道要理常提醒人默想“人生四终”：（ ）、（ ）、（ ）、（ ）。","type":"fill","answer":"死亡；审判；天堂（永生）；地狱（永罚）","explanation":"四终：死、审判、天堂、地狱（有时并入炼狱）。意在提醒人时刻准备好迎接主。","source":"《天主教教理》1013, 1021-1022条","keywords":["四终","末世","死亡"]},{"id":"quiz-067","module":"quiz","category":"末世与终局","title":"公审判（基督第二次来临）","content":"简述天主教信仰中“基督再度来临与公审判”的教导。","type":"essay","answer":"1) 耶稣基督死后复活升天，将于末日光荣中再度来临；2) 届时一切人都要复活，肉身与灵魂重新结合；3) 基督将对全人类作出公审判；4) 义人进入永生光荣，恶人进入永罚；5) 届时天主将完成新天新地，天主与人永远同在。","explanation":"评分要点：“二次来临”“死者复活”“公审判”“新天新地”至少答出三点。","source":"《天主教教理》1038-1050条；若望福音5:28-29","keywords":["公审判","基督再来","新天新地"]},{"id":"quiz-068","module":"quiz","category":"末世与终局","title":"人死后再没有悔改的机会。","content":"人死后命运已经确定，不能再悔改、再改变与天主的关系。","type":"truefalse","answer":"对","explanation":"教会训导：灵魂在死亡的瞬间即作出其最终的、不可撤回的抉择（即临终决断），死后不再有悔改机会。","source":"《天主教教理》1021-1022, 1058条","keywords":["死后","悔改","临终"]}]};

</script>

  /* ---------- 工具 ---------- */

  function esc(s){
    if(s==null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // 全角转半角
  function halfWidth(s){

  function groupByCat(list){

    list.forEach(function(it){
      if(!map[it.category]){ map[it.category]=[]; order.push(it.category); }

    });
    return {order:order, map:map};
  }
  function catOrder(list){ return groupByCat(list).order; }

  /* ---------- 视图切换 ---------- */
  var currentBrowseModule = null; // 'catechism'|'bible_stories'|'liturgy_prayers'

  function showView(name){
    $all('.view').forEach(function(v){ v.classList.remove('active'); });
    $('#view-'+name).classList.add('active');
    $all('#tabBar .tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.view===name ||
        (name==='browse' && (t.dataset.view===currentBrowseModule)) );
    });
    window.scrollTo(0,0);
  }

  /* ---------- 首页模块卡片 ---------- */
  function renderHome(){
    var grid = $('#moduleGrid');
    var items = [
      {m:'catechism', icon:'✝', h:'教理问答', p:'慕道班核心考点，分十类整理，点击展开问答。'},
      {m:'bible_stories', icon:'☉', h:'圣经故事', p:'新旧约故事通俗讲述，附圣经出处与信仰启示。'},
      {m:'liturgy_prayers', icon:'✦', h:'圣事礼仪与祈祷', p:'七件圣事、弥撒、节期与常用经文全文。'},
      {m:'quiz_questions', icon:'✎', h:'自测题库', p:'单选/判断/填空/简答，练习与整卷模拟。'}
    ];
    grid.innerHTML = items.map(function(it){
      var n = MODULES[it.m].list.length;
      return '<button class="module-card" data-go="'+it.m+'">'+
        '<h3>'+it.icon+' '+it.h+'</h3><p>'+it.p+'</p>'+
        '<span class="count">共 '+n+' 条</span></button>';
    }).join('');
    $all('#moduleGrid .module-card').forEach(function(c){
      c.addEventListener('click', function(){
        var m = c.dataset.go;
        if(m==='quiz_questions'){ openQuizHome(); }
        else{ openBrowse(m); }
      });
    });
  }

  /* ---------- 通用浏览视图 ---------- */
  function openBrowse(moduleKey, opt){
    opt = opt || {};
    currentBrowseModule = moduleKey;
    var mod = MODULES[moduleKey];
    $('#browseTitle').textContent = mod.label;
    $('#browseDesc').textContent = mod.desc + '（共 '+mod.list.length+' 条）';
    var g = groupByCat(mod.list);

    // 类别导航
    var nav = $('#catNav');
    var chips = ['全部'].concat(g.order);
    nav.innerHTML = chips.map(function(c,i){
      var cnt = i===0 ? mod.list.length : g.map[c].length;
      return '<button class="cat-chip'+(i===0?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'（'+cnt+'）</button>';
    }).join('');
    nav.querySelectorAll('.cat-chip').forEach(function(ch){
      ch.addEventListener('click', function(){
        nav.querySelectorAll('.cat-chip').forEach(function(x){x.classList.remove('active');});
        ch.classList.add('active');
        renderBrowseContent(moduleKey, ch.dataset.cat, opt.expandId);
      });
    });

    renderBrowseContent(moduleKey, opt.category || '全部', opt.expandId);
    showView('browse');
  }

  function cardBodyHtml(mod, it){
    var content = esc(it.content);
    // 保留换行
    content = content.replace(/\n/g,'<br>');
    var html = '<p>'+content+'</p>';
    html += '<div class="source">出处：'+esc(it.source||'')+'</div>';
    if(it.keywords && it.keywords.length){
      html += '<div class="kw">关键词：'+esc(it.keywords.join('、'))+'</div>';
    }
    return html;
  }

  function renderBrowseContent(moduleKey, category, expandId){
    var mod = MODULES[moduleKey];
    var box = $('#browseContent');
    var list = mod.list;
    if(category && category!=='全部'){
      list = list.filter(function(it){return it.category===category;});
    }
    var g = groupByCat(list);
    var html = g.order.map(function(cat){
      var items = g.map[cat];
      var cards = items.map(function(it){
        return '<div class="card" data-id="'+esc(it.id)+'">'+
          '<button class="card-head"><span>'+esc(it.title)+'</span><span class="arrow">›</span></button>'+
          '<div class="card-body">'+cardBodyHtml(mod,it)+'</div></div>';
      }).join('');
      return '<div class="cat-group"><h3>'+esc(cat)+'<small>'+items.length+' 条</small></h3>'+cards+'</div>';
    }).join('');
    box.innerHTML = html;
    bindCards(box);
    if(expandId){
      var target = box.querySelector('.card[data-id="'+CSS.escape(expandId)+'"]');
      if(target){
        target.classList.add('open');
        setTimeout(function(){ target.scrollIntoView({behavior:'smooth',block:'center'}); }, 80);
      }
    }
  }

  function bindCards(scope){
    scope.querySelectorAll('.card-head').forEach(function(h){
      h.addEventListener('click', function(){
        h.parentElement.classList.toggle('open');
      });
    });
  }

  /* ---------- 搜索 ---------- */
  function doSearch(kw){
    kw = (kw||'').trim();
    if(!kw){ return; }
    showView('search');
    $('#searchMeta').textContent = '关键词：「'+kw+'」';
    var results = {catechism:[], bible_stories:[], liturgy_prayers:[], quiz_questions:[]};
    var lower = kw.toLowerCase();
    function hit(it){
      var hay = [it.title, it.content, it.source, (it.keywords||[]).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(lower)>=0;
    }
    ['catechism','bible_stories','liturgy_prayers','quiz_questions'].forEach(function(m){
      MODULES[m].list.forEach(function(it){ if(hit(it)) results[m].push(it); });
    });
    var total = results.catechism.length+results.bible_stories.length+results.liturgy_prayers.length+results.quiz_questions.length;
    $('#searchMeta').textContent = '关键词：「'+kw+'」，共 '+total+' 条结果';
    var box = $('#searchContent');
    if(total===0){
      box.innerHTML = '<div class="search-empty"><p>没有找到与「'+esc(kw)+'」相关的内容。</p><p>试试更短或更常见的词，如「圣事」「耶稣」「祈祷」。</p></div>';
      return;
    }
    var modNames = {catechism:'教理问答', bible_stories:'圣经故事', liturgy_prayers:'礼仪祈祷', quiz_questions:'自测题库'};
    var html = '';
    ['catechism','bible_stories','liturgy_prayers','quiz_questions'].forEach(function(m){
      if(!results[m].length) return;
      html += '<div class="search-group"><h3>'+modNames[m]+'（'+results[m].length+'）</h3>';
      html += results[m].map(function(it){
        var body = m==='quiz_questions' ? quizResultBody(it) : cardBodyHtml(MODULES[m], it);
        return '<div class="card" data-module="'+m+'" data-id="'+esc(it.id)+'">'+
          '<button class="card-head"><span>'+esc(it.title)+'</span>'+
          '<span class="arrow">›</span></button>'+
          '<div class="card-body"><div class="kw">所属类别：'+esc(it.category)+'</div>'+body+'</div></div>';
      }).join('');
      html += '</div>';
    });
    box.innerHTML = html;
    bindCards(box);
    // 浏览类结果点击后跳转定位
    box.querySelectorAll('.card').forEach(function(c){
      var h = c.querySelector('.card-head');
      h.addEventListener('click', function(){
        var m = c.dataset.module;
        if(m==='quiz_questions') return; // 已内联展开
        openBrowse(m, {category: c.querySelector('.kw').textContent.replace('所属类别：','').trim(), expandId: c.dataset.id});
      });
    });
  }

  function quizResultBody(it){
    var h = '<p>'+esc(it.content).replace(/\n/g,'<br>')+'</p>';
    if(it.options && it.options.length){
      h += '<p class="label">选项：</p><p>'+esc(it.options.join('　'))+'</p>';
    }
    h += '<p><span class="label">答案：</span>'+esc(it.answer)+'</p>';
    h += '<p><span class="label">解析：</span>'+esc(it.explanation)+'</p>';
    h += '<div class="source">出处：'+esc(it.source||'')+'</div>';
    return h;
  }

  /* ---------- 自测题库 ---------- */
  var TYPE_LABEL = {choice:'单选', truefalse:'判断', fill:'填空', essay:'简答'};
  var practice = {queue:[], idx:0, answers:{}};
  var mock = {queue:[], idx:0, answers:{}};

  function openQuizHome(){
    showView('quiz');
    showOnlyStage('quizHome');
  }
  function showOnlyStage(id){
    ['quizHome','practiceSetup','practiceRun','mockSetup','mockRun','mockResult','historyView'].forEach(function(s){
      $('#'+s).classList.toggle('hidden', s!==id);
    });
  }

  function fillCatSelect(){
    var sel = $('#practiceCat');
    var cats = catOrder(D.quiz_questions);
    sel.innerHTML = '<option value="all">全部类别</option>' +
      cats.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
  }

  function startPractice(){
    var type = $('#practiceType').value;
    var cat = $('#practiceCat').value;
    var q = D.quiz_questions.filter(function(it){
      if(type!=='all' && it.type!==type) return false;
      if(cat!=='all' && it.category!==cat) return false;
      return true;
    });
    if(!q.length){ alert('该筛选条件下没有题目，请调整。'); return; }
    practice.queue = q; practice.idx = 0; practice.answers = {};
    $('#practiceTotal').textContent = '共 '+q.length+' 题';
    showOnlyStage('practiceRun');
    renderPracticeQ();
  }

  function renderPracticeQ(){
    var it = practice.queue[practice.idx];
    $('#practicePos').textContent = '第 '+(practice.idx+1)+' / '+practice.queue.length+' 题';
    $('#practiceBox').innerHTML = questionHtml(it, practice.answers[it.id], 'practice');
    bindQuestion('#practiceBox', it, 'practice');
  }

  function questionHtml(it, ans, mode){
    var h = '<div class="q-card">'+
      '<div class="q-meta"><span class="q-type">'+TYPE_LABEL[it.type]+'</span>'+esc(it.category)+'</div>'+
      '<div class="q-stem">'+esc(it.content)+'</div>';
    if(it.type==='choice'){
      h += '<div class="q-options">' + it.options.map(function(op,i){
        var letter = op.trim().charAt(0).toUpperCase();
        var cls = ans && ans.user===letter ? 'selected' : '';
        return '<button class="q-opt '+cls+'" data-letter="'+letter+'">'+esc(op)+'</button>';
      }).join('') + '</div>';
    } else if(it.type==='truefalse'){
      h += '<div class="q-options">'+
        '<button class="q-opt'+(ans&&ans.user==='对'?' selected':'')+'" data-tf="对">对（正确）</button>'+
        '<button class="q-opt'+(ans&&ans.user==='错'?' selected':'')+'" data-tf="错">错（错误）</button></div>';
    } else if(it.type==='fill'){
      h += '<div class="q-fill"><input type="text" id="fillInput" placeholder="请输入答案" value="'+(ans?esc(ans.user):'')+'">'+
        '<div style="margin-top:8px"><button class="btn primary" id="fillSubmit">提交答案</button></div></div>';
    } else if(it.type==='essay'){
      h += '<div class="q-fill"><textarea id="essayInput" rows="4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;" placeholder="请写下你的回答（仅作练习，不计分）">'+(ans?esc(ans.user):'')+'</textarea>'+
        '<div style="margin-top:8px"><button class="btn primary" id="essayShow">查看参考答案</button></div></div>';
    }
    h += '<div class="q-feedback" id="qFeedback"></div>';
    h += '<div class="q-source">出处：'+esc(it.source||'')+'</div>';
    h += '</div>';
    return h;
  }

  function feedbackHtml(it, ans, isCorrect){
    var fb = $('#qFeedback');
    if(it.type==='essay'){
      fb.className = 'q-feedback show';
      fb.style.background = '#fff3d6'; fb.style.color = '#8a6d1a'; fb.style.border = '1px solid #e5d28a';
      fb.innerHTML = '参考答案（请自行对照）：<span class="exp">'+esc(it.answer)+'</span>'+
        '<span class="exp"><b>解析：</b>'+esc(it.explanation)+'</span>';
      return;
    }
    var ok = isCorrect;
    fb.className = 'q-feedback show ' + (ok?'ok':'no');
    var head = ok ? '✓ 回答正确！' : '✗ 回答错误。';
    fb.innerHTML = head + ' 正确答案：<b>'+esc(it.answer)+'</b>'+
      '<span class="exp"><b>解析：</b>'+esc(it.explanation)+'</span>';
  }

  function gradeAnswer(it, userAns){
    if(it.type==='choice') return userAns === it.answer.toUpperCase();
    if(it.type==='truefalse') return userAns === it.answer;
    if(it.type==='fill') return normalizeFill(userAns) === normalizeFill(it.answer);
    return null; // essay
  }

  function bindQuestion(scopeSel, it, mode){
    var scope = $(scopeSel);
    var store = mode==='practice' ? practice : mock;

    function save(userAns, judged){
      store.answers[it.id] = {user:userAns, judged:judged};
    }

    if(it.type==='choice'){
      scope.querySelectorAll('.q-opt').forEach(function(b){
        b.addEventListener('click', function(){
          if(store.answers[it.id] && store.answers[it.id].judged) return; // 已判分
          var letter = b.dataset.letter;
          var ok = gradeAnswer(it, letter);
          save(letter, true);
          scope.querySelectorAll('.q-opt').forEach(function(x){
            var L = x.dataset.letter;
            x.classList.remove('selected');
            if(L===it.answer.toUpperCase()) x.classList.add('correct');
            if(L===letter && !ok) x.classList.add('wrong');
            if(L===letter && ok) x.classList.add('selected');
          });
          feedbackHtml(it, store.answers[it.id], ok);
        });
      });
    } else if(it.type==='truefalse'){
      scope.querySelectorAll('.q-opt').forEach(function(b){
        b.addEventListener('click', function(){
          if(store.answers[it.id] && store.answers[it.id].judged) return;
          var v = b.dataset.tf;
          var ok = gradeAnswer(it, v);
          save(v, true);
          scope.querySelectorAll('.q-opt').forEach(function(x){
            var V = x.dataset.tf;
            x.classList.remove('selected');
            if(V===it.answer) x.classList.add('correct');
            if(V===v && !ok) x.classList.add('wrong');
          });
          feedbackHtml(it, store.answers[it.id], ok);
        });
      });
    } else if(it.type==='fill'){
      var sub = scope.querySelector('#fillSubmit');
      sub.addEventListener('click', function(){
        if(store.answers[it.id] && store.answers[it.id].judged) return;
        var v = scope.querySelector('#fillInput').value;
        var ok = gradeAnswer(it, v);
        save(v, true);
        feedbackHtml(it, store.answers[it.id], ok);
        sub.disabled = true;
      });
    } else if(it.type==='essay'){
      var show = scope.querySelector('#essayShow');
      show.addEventListener('click', function(){
        save(scope.querySelector('#essayInput').value, true);
        feedbackHtml(it, store.answers[it.id], null);
        show.disabled = true;
      });
    }
  }

  /* 模拟卷 */
  function startMock(){
    var n = parseInt($('#mockCount').value,10);
    var pool = D.quiz_questions.slice();
    // 洗牌
    for(var i=pool.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = pool[i]; pool[i]=pool[j]; pool[j]=t;
    }
    mock.queue = pool.slice(0, Math.min(n, pool.length));
    mock.idx = 0; mock.answers = {};
    $('#mockTotal').textContent = '共 '+mock.queue.length+' 题';
    showOnlyStage('mockRun');
    renderMockQ();
  }
  function renderMockQ(){
    var it = mock.queue[mock.idx];
    $('#mockPos').textContent = '第 '+(mock.idx+1)+' / '+mock.queue.length+' 题';
    $('#mockBox').innerHTML = questionHtml(it, mock.answers[it.id], 'mock');
    bindQuestion('#mockBox', it, 'mock');
  }

  function submitMock(){
    var total = mock.queue.length;
    var unanswered = mock.queue.filter(function(it){ return !mock.answers[it.id]; }).length;
    if(unanswered>0){
      if(!confirm('还有 '+unanswered+' 题未作答，确定交卷吗？')) return;
    }
    var objective = mock.queue.filter(function(it){return it.type!=='essay';});
    var correct = 0;
    objective.forEach(function(it){
      var a = mock.answers[it.id];
      if(a && gradeAnswer(it, a.user)) correct++;
    });
    var essayCount = total - objective.length;
    var acc = objective.length ? Math.round(correct/objective.length*100) : 0;

    // 保存成绩
    try{
      var hist = JSON.parse(localStorage.getItem('catholic_quiz_history')||'[]');
      hist.unshift({time:new Date().toLocaleString('zh-CN'), count:total, objective:objective.length,
        correct:correct, essay:essayCount, acc:acc});
      localStorage.setItem('catholic_quiz_history', JSON.stringify(hist.slice(0,50)));
    }catch(e){}

    // 渲染结果
    $('#resultBox').innerHTML =
      '<div class="result-score">'+
        '<div class="big">'+correct+' / '+objective.length+'</div>'+
        '<div class="sub">正确率 '+acc+'%（共 '+total+' 题，其中简答 '+essayCount+' 题需自行对照参考答案）</div>'+
      '</div>';
    showOnlyStage('mockResult');
  }

  function renderMockReview(){
    var html = '<div class="result-score"><div class="big">答题回顾</div></div>';
    mock.queue.forEach(function(it, i){
      var a = mock.answers[it.id];
      var badge, body='';
      if(it.type==='essay'){
        badge = '<span class="badge manual">简答·自查</span>';
        body = '<p>你的回答：'+(a?esc(a.user):'<i>未作答</i>')+'</p>'+
               '<p><span class="label">参考答案：</span>'+esc(it.answer)+'</p>';
      } else {
        var ok = a && gradeAnswer(it, a.user);
        badge = ok ? '<span class="badge right">✓ 正确</span>' : '<span class="badge wrong">✗ 错误</span>';
        body = '<p>你的答案：<b>'+(a?esc(a.user):'未作答')+'</b>　正确答案：<b>'+esc(it.answer)+'</b></p>';
      }
      html += '<div class="review-item"><div class="ri-head"><span>第 '+(i+1)+' 题 · '+TYPE_LABEL[it.type]+' · '+esc(it.category)+'</span>'+badge+'</div>'+
        '<p style="margin:8px 0">'+esc(it.content)+'</p>'+body+
        '<p><span class="label">解析：</span>'+esc(it.explanation)+'</p>'+
        '<p class="q-source">出处：'+esc(it.source||'')+'</p></div>';
    });
    $('#resultBox').innerHTML = html;
    showOnlyStage('mockResult');
  }

  /* 历史 */
  function renderHistory(){
    showOnlyStage('historyView');
    var hist = [];
    try{ hist = JSON.parse(localStorage.getItem('catholic_quiz_history')||'[]'); }catch(e){}
    if(!hist.length){
      $('#historyList').innerHTML = '<p class="hint">暂无模拟成绩记录。完成一次「整卷模拟」后将自动保存在本机。</p>';
      return;
    }
    var rows = hist.map(function(r,i){
      return '<tr><td>'+(i+1)+'</td><td>'+esc(r.time)+'</td><td>'+r.count+'</td>'+
        '<td>'+r.correct+' / '+r.objective+'</td><td>'+r.acc+'%</td><td>'+(r.essay||0)+'</td></tr>';
    }).join('');
    $('#historyList').innerHTML =
      '<div class="table-wrap"><table class="hist-table"><thead><tr><th>#</th><th>时间</th><th>题数</th><th>答对(客观)</th><th>正确率</th><th>简答数</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>';
  }

  /* ---------- 事件绑定 ---------- */
  function bind(){
    // tab
    $all('#tabBar .tab').forEach(function(t){
      t.addEventListener('click', function(){
        var v = t.dataset.view;
        if(v==='home'){ showView('home'); }
        else if(v==='quiz'){ openQuizHome(); }
        else { openBrowse(v); }
      });
    });
    $('#btnHome').addEventListener('click', function(){ showView('home'); });

    // 搜索
    function triggerSearch(){
      var kw = ($('#globalSearch').value || $('#homeSearch').value || '').trim();
      if(kw){ $('#homeSearch').value = kw; $('#globalSearch').value = kw; doSearch(kw); }
    }
    $('#globalSearch').addEventListener('keydown', function(e){ if(e.key==='Enter') triggerSearch(); });
    $('#homeSearch').addEventListener('keydown', function(e){ if(e.key==='Enter') triggerSearch(); });

    // quiz mode
    $('#modePractice').addEventListener('click', function(){ showOnlyStage('practiceSetup'); });
    $('#modeMock').addEventListener('click', function(){ showOnlyStage('mockSetup'); });
    $('#modeHistory').addEventListener('click', renderHistory);
    $('#practiceBack').addEventListener('click', openQuizHome);
    $('#mockBack').addEventListener('click', openQuizHome);
    $('#historyBack').addEventListener('click', openQuizHome);

    $('#btnStartPractice').addEventListener('click', startPractice);
    $('#practicePrev').addEventListener('click', function(){
      if(practice.idx>0){ practice.idx--; renderPracticeQ(); }
    });
    $('#practiceNext').addEventListener('click', function(){
      if(practice.idx<practice.queue.length-1){ practice.idx++; renderPracticeQ(); }
    });
    $('#practiceQuit').addEventListener('click', openQuizHome);

    $('#btnStartMock').addEventListener('click', startMock);
    $('#mockPrev').addEventListener('click', function(){
      if(mock.idx>0){ mock.idx--; renderMockQ(); }
    });
    $('#mockNext').addEventListener('click', function(){
      if(mock.idx<mock.queue.length-1){ mock.idx++; renderMockQ(); }
    });
    $('#mockSubmit').addEventListener('click', submitMock);
    $('#mockReviewBtn').addEventListener('click', renderMockReview);
    $('#mockResultBack').addEventListener('click', openQuizHome);

    $('#btnClearHistory').addEventListener('click', function(){
      if(confirm('确定清除全部历史成绩？此操作不可恢复。')){
        localStorage.removeItem('catholic_quiz_history');
        renderHistory();
      }
    });
  }

  /* ---------- 启动 ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    renderHome();
    fillCatSelect();
    bind();
    showView('home');
  });
})();

</script>
</body>
</html>
